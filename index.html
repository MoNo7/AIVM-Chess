<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightchain AIVM Chess</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="icon" type="image/png" href="https://lightchain.ai/_next/image?url=%2Fimages%2Fbrand-page%2Fsymbol-pack%2Fpng-symbol%2Fsymbol-light.png&w=96&q=75">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Play the AIVM Grandmaster</h1>
    
    <div id="setup-area">
        <button id="connect-btn" onclick="connectWallet()">Connect Wallet</button>
        <p id="wallet-address">Not Connected</p>
        
        <div id="game-options" style="display: none;">
            <input type="number" id="betAmount" placeholder="Bet Amount (Optional)">
            <button id="start-btn" onclick="startMatch()">Start Match</button>
        </div>
    </div>

    <div id="admin-menu" style="display: none; background: #2a2a2a; padding: 15px; border-radius: 8px; margin-top: 10px;">
        <h3>Admin Dashboard</h3>
        <p>Vault Balance: <span id="vault-balance">0</span> LCAI</p>
        <button onclick="updateVaultDisplay()">Refresh Balance</button>
    </div>

    <div id="board-container" style="display: none;">
        <div id="myBoard" style="width: 400px; margin: 0 auto;"></div>
    </div>
</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="app.js"></script>

</body>
</html>
