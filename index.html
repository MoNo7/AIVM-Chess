<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightchain AIVM Chess</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="icon" type="image/png" href="https://lightchain.ai/_next/image?url=%2Fimages%2Fbrand-page%2Fsymbol-pack%2Fpng-symbol%2Fsymbol-light.png&w=96&q=75">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Play the AIVM Grandmaster</h1>
    
    <div id="setup-area">
        <div id="wallet-section">
            <span id="wallet-address" style="cursor:pointer; font-weight:bold; display:block; margin-bottom:10px;"><button id="connect-btn" class="btn">Connect Wallet</button></span>
        </div>
        
        <div id="game-controls">
            <div id="match-setup">
                <input type="number" id="betAmount" placeholder="Bet Amount (LCAI)" value="0">
                <button id="start-btn" class="btn" style="display:none;">Start Match</button>
            </div>
            <div id="game-options" style="display:none;">
                <button id="reset-btn" class="btn btn-secondary">Reset Board</button>
            </div>
        </div>
    </div>

    <div id="admin-panel" style="display:none; border: 2px solid #ff4444; padding: 15px; margin: 20px auto; max-width: 400px; background: #1a1a1a;">
        <h3 style="color: #ff4444;">Admin Dashboard</h3>
        <p>Vault Available: <span id="vault-available">0</span> LCAI</p>
        <div class="admin-actions">
            <input type="number" id="withdraw-amount" placeholder="LCAI Amount">
            <button id="adminWithdrawBtn" class="btn">Withdraw Revenue</button>
        </div>
        <button onclick="updateVaultDisplay()" class="btn-small">Refresh Balance</button>
    </div>

    <div id="board-container" style="display: none;">
        <h2 id="game-title">Game in Progress</h2>
        <div id="myBoard" style="width: 400px; margin: auto;"></div>
        <p id="game-status"></p>
    </div>
</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
