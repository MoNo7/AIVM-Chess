<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightchain AIVM Chess</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="icon" type="image/png" href="https://lightchain.ai/_next/image?url=%2Fimages%2Fbrand-page%2Fsymbol-pack%2Fpng-symbol%2Fsymbol-light.png&w=96&q=75">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Play the AIVM Grandmaster</h1>
    
    <div id="setup-area">
        <button id="connect-btn" onclick="connectWallet()">Connect Wallet</button>
        <p id="wallet-address" onclick="toggleAdminMenu()" style="cursor: pointer; color: #aaa;">Not Connected</p>        
        <div id="game-options" style="display: none;">
            <input type="number" id="betAmount" placeholder="Bet Amount (Optional)">
            <button id="start-btn" onclick="startMatch()">Start Match</button>
        </div>
    </div>

    <div id="game-options" style="display:none;">
        <button id="start-btn" class="btn">Start New Match</button>
        <button id="reset-btn" class="btn btn-secondary">Reset Board</button>
    </div>
    
    <div id="wallet-info">
        <span id="wallet-address" style="cursor:pointer; font-weight:bold;">Connect Wallet</span>
    </div>
    
    <div id="admin-panel" style="display:none; border: 1px solid red; padding: 10px; margin-top: 20px;">
        <h3>Admin Dashboard</h3>
        <p>Vault Available: <span id="vault-available">0</span> LCAI</p>
        <input type="number" id="withdraw-amount" placeholder="LCAI">
        <button id="adminWithdrawBtn">Withdraw</button>
    </div>

    <div id="admin-menu" style="display: none; border: 1px solid red; padding: 10px;">
        <h3>Admin Dashboard</h3>
        <p>Vault Balance: <span id="vault-balance">0</span> LCAI</p>
        <button onclick="updateVaultDisplay()">Refresh Balance</button>
        <input type="number" id="withdraw-amount" placeholder="LCAI Amount">
        <button id="adminWithdrawBtn">Withdraw Revenue</button>
    </div>

    <div id="board-container" style="display: none;">
        <h2 id="game-title">Game in Progress</h2>
        <div id="myBoard" style="width: 400px; margin: auto;"></div>
        <p id="game-status"></p>
    </div>
</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="app.js"></script>

</body>
</html>
