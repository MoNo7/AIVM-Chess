<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightchain AIVM Chess</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="icon" type="image/png" href="https://lightchain.ai/_next/image?url=%2Fimages%2Fbrand-page%2Fsymbol-pack%2Fpng-symbol%2Fsymbol-light.png&w=96&q=75">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Play the AIVM Grandmaster</h1>
    
    <div id="setup-area">
        <div id="wallet-section">
            <span id="wallet-address" style="cursor:pointer; font-weight:bold; color:#f1c40f;">Connect Wallet</span>
            <button id="connect-btn" class="btn">Connect Wallet</button>
        </div>
        
        <div id="game-controls" style="display:none;">
            <input type="number" id="betAmount" placeholder="Bet (LCAI)" value="0">
            <button id="start-btn" class="btn">Start Match</button>
            <button id="reset-board-btn" class="btn btn-secondary">Sync Board</button>
        </div>
    </div>

    <div id="admin-panel" style="display:none; border: 1px solid #ff4444; padding: 15px; background:#111;">
        <h3>Admin Dashboard</h3>
        <p>Vault: <span id="vault-available">0</span> LCAI</p>
        <input type="number" id="withdraw-amount" placeholder="LCAI">
        <button id="adminWithdrawBtn">Withdraw</button>
    </div>

    <div id="board-container" style="display:none;">
        <h2 id="game-title">Game in Progress</h2>
        <div id="myBoard" style="width: 400px; margin: auto;"></div>
        <p id="game-status"></p>
    </div>
</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
